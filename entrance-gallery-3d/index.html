<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nexora Residences | Real Estate 3D Model Walkthrough</title>
    <meta name="description" content="Interactive 3D real estate digital twin model walkthrough: explore the architectural exhibition entrance, resort aquatics swimming pool from all 4 sides, glass wellness gym, full gated society with 15-floor towers, parking plaza, walking promenades, and luxury walk-in bungalow." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Top Header Navigation -->
    <header class="gallery-nav" id="gallery-nav">
      <div class="gallery-nav__brand">
        <div class="nomadiic-brand">
          <span class="nomadiic-brand__text">NEXORA RESIDENCES</span>
          <span class="nomadiic-brand__sub">REAL ESTATE 3D DIGITAL MODEL</span>
        </div>
      </div>

      <!-- Quick Walkthrough Station Navigation Pills -->
      <nav class="room-nav-pills" id="room-nav-pills" aria-label="Real Estate Model Walkthrough Navigation">
        <button type="button" class="room-pill is-active" data-progress="0.00" title="Step into 3D Architectural Model Entrance">
          <span class="room-pill__icon">🏛️</span>
          <span class="room-pill__label">3D Entrance</span>
        </button>
        <button type="button" class="room-pill" data-progress="0.25" title="Explore Luxury Swimming Pool from all 4 sides">
          <span class="room-pill__icon">🏊</span>
          <span class="room-pill__label">Swimming Pool</span>
        </button>
        <button type="button" class="room-pill" data-progress="0.45" title="Explore Wellness Gym from all 4 sides">
          <span class="room-pill__icon">🏋️</span>
          <span class="room-pill__label">Wellness Gym</span>
        </button>
        <button type="button" class="room-pill" data-progress="0.65" title="Explore Full Society Grounds, Parking Plaza & Towers">
          <span class="room-pill__icon">🏘️</span>
          <span class="room-pill__label">Society & Parking</span>
        </button>
        <button type="button" class="room-pill" data-progress="0.85" title="Walk inside Central Luxury Bungalow Villa">
          <span class="room-pill__icon">🏡</span>
          <span class="room-pill__label">Central Villa</span>
        </button>
      </nav>

      <div class="gallery-nav__status">
        <span class="status-indicator"></span>
        <span id="nav-status-text">3D Architectural Model · Interactive Real Estate Walkthrough</span>
      </div>

      <!-- Day / Night Linear Gradient Controller -->
      <div class="daynight-controller" id="daynight-controller" title="Slide to check Day & Night Lighting Effect">
        <span class="daynight-icon day-icon" aria-hidden="true">☀️</span>
        <div class="gradient-slider-track">
          <input type="range" id="daynight-slider" min="0" max="100" value="0" step="1" aria-label="Day and Night Lighting Slider" />
        </div>
        <span class="daynight-icon night-icon" aria-hidden="true">🌙</span>
        <span class="daynight-badge" id="daynight-badge">DAY 12:00 PM</span>
      </div>

      <div class="gallery-nav__actions">
        <!-- Orange Contact / Client Inquiry button -->
        <a href="#contact" class="contact-pill-btn" id="inquire-btn">
          Inquire 3D Twin
        </a>
      </div>
    </header>

    <!-- Stage 1: Nomadiic Horse Realtime Palace Container (Hidden) -->
    <div id="palace-container" class="stage-layer" role="region" aria-label="Palace Background" style="display:none;"></div>

    <!-- Stage 2: Three.js Real Estate 3D Digital Model Container -->
    <div id="canvas-container" class="stage-layer" role="region" aria-label="3D Real Estate Walkthrough Experience">
      <!-- 3D Projected Spatial Labels Layer -->
      <div id="spatial-labels-layer" class="spatial-labels-layer" aria-hidden="true"></div>
    </div>

    <!-- 4-Side Panoramic View Controls (Dynamically updates for each station) -->
    <nav class="society-view-controls" id="society-view-controls" aria-label="4-Side Panoramic Angles">
      <div id="view-controls-buttons" class="view-controls-buttons">
        <!-- Injected dynamically in JavaScript based on active station -->
      </div>
    </nav>

    <!-- Floating Cursor Tip -->
    <div class="cursor-tip" id="cursor-tip" aria-hidden="true">
      <span class="cursor-tip-pill" id="cursor-tip-pill">EXPLORE IN 3D</span>
    </div>

    <!-- Navigation Step Back Button -->
    <div class="portal-back-wrap" id="portal-back-wrap" aria-hidden="true">
      <button type="button" class="portal-back-btn" id="portal-back-btn">
        <svg viewBox="0 0 20 20" fill="none" width="16" height="16" aria-hidden="true">
          <path d="M16 10H5M9 5.5 4.5 10 9 14.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="portal-back-text">← STEP BACK</span>
      </button>
    </div>

    <!-- Bottom-Left Audio Equalizer Pill -->
    <button type="button" class="audio-pill is-active" id="audio-toggle" aria-label="Toggle Sound Ambience">
      <div class="eq-bars">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
    </button>

    <!-- Bottom-Right Navigation Controls & Hint -->
    <div class="bottom-right-wrap" id="bottom-right-wrap">
      <div class="room-nav" id="room-nav">
        <button type="button" class="round-nav-btn" id="prev-btn" aria-label="Previous station">←</button>
        <button type="button" class="round-nav-btn" id="next-btn" aria-label="Next station">→</button>
      </div>

      <p class="walk-hint" id="walk-hint" aria-live="polite">
        <span id="hint-line-1">Real Estate 3D Walkthrough</span>
        <span id="hint-line-2">Scroll or click pills above to experience amenities & society</span>
      </p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
