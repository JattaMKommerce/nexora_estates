    <!-- Paint the page colour before any script runs (no white flash), and style the boot state. -->
    <style>
      html { background: #0c0f14; color: #f3eee6; }
      body { margin: 0; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #0c0f14; }
      .boot__label { font: 500 11px/1 'Plus Jakarta Sans', system-ui, sans-serif; letter-spacing: 0.32em; text-transform: uppercase; color: #8e887e; opacity: 0; transition: opacity 0.6s ease; }
      .boot__label.is-visible { opacity: 1; }
    </style>
    <title>Restate</title>
  </head>
