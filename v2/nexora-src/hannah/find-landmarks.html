<!doctype html><html><body><pre id="out">waiting</pre>
<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const out = document.getElementById('out');
try {
  const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const fl = await FaceLandmarker.createFromOptions(fs, { baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate: "CPU" }, runningMode: "IMAGE", numFaces: 1, outputFaceBlendshapes: true });
  const img = new Image(); img.src = new URLSearchParams(location.search).get('img') || 'hannah-portrait.png'; await img.decode();
  const r = fl.detect(img);
  const W = img.naturalWidth, H = img.naturalHeight;
  const pts = r.faceLandmarks[0].map(p => [+(p.x*W).toFixed(2), +(p.y*H).toFixed(2), +(p.z*W).toFixed(2)]);
  const bs = {}; (r.faceBlendshapes[0]?.categories||[]).forEach(c => { if (c.score > 0.05) bs[c.categoryName] = +c.score.toFixed(3); });
  out.textContent = 'RESULT' + JSON.stringify({ W, H, pts, bs, tris: FaceLandmarker.FACE_LANDMARKS_TESSELATION.length });
} catch (e) { out.textContent = 'ERR ' + e.stack; }
</script></body></html>
